global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'inference-platform'

scrape_configs:
  - job_name: 'inference-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 10s

  - job_name: 'vllm-engine'
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
