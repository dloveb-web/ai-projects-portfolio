# =============================================================================
# Industrial AI Quality Copilot — Docker Compose stack
# =============================================================================
# Start:   docker compose -f docker/docker-compose.yml up -d
# Stop:    docker compose -f docker/docker-compose.yml down
# Logs:    docker compose -f docker/docker-compose.yml logs -f
# =============================================================================

version: "3.9"

services:
  # -- API server ------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quality-copilot-api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
    env_file:
      - ../.env
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -- Gradio UI -------------------------------------------------------------
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quality-copilot-ui
    command: python src/ui/gradio_app.py
    ports:
      - "7860:7860"
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
    env_file:
      - ../.env
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # -- Nginx reverse proxy (optional) ----------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: quality-copilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - api
      - ui
    profiles:
      - production  # only start with: docker compose --profile production up

  # -- Prometheus metrics (optional) -----------------------------------------
  prometheus:
    image: prom/prometheus:v2.53
    container_name: quality-copilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    profiles:
      - production

volumes:
  data:
  models:
