# Prometheus configuration for Industrial AI Quality Copilot
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "quality-copilot-api"
    static_configs:
      - targets: ["quality-copilot-api:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
