version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pcba-detector:latest
    container_name: pcba-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/test_samples:/app/samples:ro
    environment:
      - MODEL_VERSION=v1.0
      - MODEL_NAME=yolov8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    image: python:3.11-slim-bookworm
    container_name: pcba-web
    working_dir: /app
    command: >
      sh -c "pip install streamlit pillow numpy requests &&
             streamlit run demo_app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./web:/app:ro
    depends_on:
      - api
    restart: unless-stopped
